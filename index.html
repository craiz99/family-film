<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Night — Family Film</title>
  <meta name="description" content="A cozy, cartoon-style animated movie night scene with a suave fox, an excited purple bat, and a clumsy skunk with popcorn." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-night: #17142b;
      --bg-deep: #0f0d1e;
      --ink: #1e1b2e;
      --cream: #fff8ec;
      --gold: #ffd166;
      --coral: #ff6b6b;
      --teal: #2ec4b6;
      --purple: #9b5de5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 25%, #2b2352 0%, var(--bg-night) 55%, var(--bg-deep) 100%);
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      color: var(--cream);
      overflow-x: hidden;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 1060px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 4px;
    }

    .title-group h1 {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: clamp(1.35rem, 2.8vw, 1.95rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--gold);
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    }

    .title-group p {
      font-size: 0.92rem;
      color: #c8c2e6;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      appearance: none;
      border: 2.5px solid var(--ink);
      background: var(--cream);
      color: var(--ink);
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
    }

    .btn:hover {
      background: var(--gold);
      transform: translateY(-1px);
      box-shadow: 0 4px 0 var(--ink);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .btn.primary {
      background: var(--gold);
    }

    .scene-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1200 / 740;
      border-radius: 24px;
      overflow: hidden;
      border: 4px solid var(--ink);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #2b2248;
      user-select: none;
    }

    .scene-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Animated TV Screen Light Glow Overlay */
    .tv-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.36;
      animation: tvColorShift 9s ease-in-out infinite alternate;
    }

    @keyframes tvColorShift {
      0% {
        background: radial-gradient(ellipse at 50% 95%, rgba(92, 225, 230, 0.72) 0%, rgba(92, 225, 230, 0.16) 48%, transparent 78%);
      }
      33% {
        background: radial-gradient(ellipse at 48% 95%, rgba(255, 209, 102, 0.68) 0%, rgba(255, 140, 105, 0.18) 48%, transparent 78%);
      }
      66% {
        background: radial-gradient(ellipse at 52% 95%, rgba(167, 139, 250, 0.7) 0%, rgba(244, 114, 182, 0.18) 48%, transparent 78%);
      }
      100% {
        background: radial-gradient(ellipse at 50% 95%, rgba(74, 222, 128, 0.62) 0%, rgba(56, 189, 248, 0.18) 48%, transparent 78%);
      }
    }

    /* Speech Bubbles Layer */
    .bubbles-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .speech-bubble {
      position: absolute;
      max-width: min(260px, 28%);
      background: #ffffff;
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 10px 14px;
      font-size: clamp(0.72rem, 1.35vw, 0.95rem);
      font-weight: 700;
      line-height: 1.32;
      box-shadow: 0 5px 0 rgba(30, 27, 46, 0.9);
      opacity: 0;
      transform: translate(-50%, -8px) scale(0.86);
      transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
      cursor: pointer;
    }

    .speech-bubble.visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 10px 0 10px;
      border-style: solid;
      border-color: var(--ink) transparent transparent transparent;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 8px 0 8px;
      border-style: solid;
      border-color: #ffffff transparent transparent transparent;
      z-index: 1;
    }

    .speaker-tag {
      display: block;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .speaker-fox { color: #e85d04; }
    .speaker-bat { color: #7b2cbf; }
    .speaker-skunk { color: #d62828; }

    #bubble-fox { left: 26%; top: 24%; }
    #bubble-bat { left: 53%; top: 10%; }
    #bubble-skunk { left: 76%; top: 25%; }

    .dialogue-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #bdb6de;
      padding: 0 4px;
    }

    /* SVG Character & Scene Animations */
    .fairy-bulb {
      animation: twinkle 2.4s ease-in-out infinite alternate;
    }
    .fairy-bulb:nth-child(even) {
      animation-delay: 1.1s;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.65; filter: brightness(0.95); }
      50% { opacity: 1; filter: brightness(1.3); }
    }

    /* Fox Animations */
    .fox-group {
      cursor: pointer;
      transform-origin: 315px 470px;
    }
    .fox-group.react {
      animation: charPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fox-tail {
      transform-origin: 235px 485px;
      animation: foxTailSway 3.6s ease-in-out infinite;
    }
    @keyframes foxTailSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(8deg); }
    }
    .fox-ear-r {
      transform-origin: 345px 318px;
      animation: earTwitch 5s ease-in-out infinite;
    }
    @keyframes earTwitch {
      0%, 84%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(8deg); }
      92% { transform: rotate(-3deg); }
    }
    .fox-wink-eye {
      transform-origin: 335px 358px;
      animation: foxWink 5.5s ease-in-out infinite;
    }
    @keyframes foxWink {
      0%, 74%, 84%, 100% { transform: scaleY(1); }
      79% { transform: scaleY(0.12); }
    }

    /* Bat Animations */
    .bat-group {
      cursor: pointer;
      animation: batFlight 4.2s ease-in-out infinite;
    }
    @keyframes batFlight {
      0%, 100% { transform: translate(0px, 0px) rotate(-2deg); }
      25% { transform: translate(18px, -22px) rotate(4deg); }
      50% { transform: translate(0px, -10px) rotate(1deg); }
      75% { transform: translate(-20px, -24px) rotate(-5deg); }
    }
    .bat-wing-l {
      transform-origin: 575px 258px;
      animation: wingFlapL 0.42s ease-in-out infinite alternate;
    }
    .bat-wing-r {
      transform-origin: 635px 258px;
      animation: wingFlapR 0.42s ease-in-out infinite alternate;
    }
    @keyframes wingFlapL {
      0% { transform: rotate(-14deg) scaleX(0.95); }
      100% { transform: rotate(22deg) scaleX(1.04); }
    }
    @keyframes wingFlapR {
      0% { transform: rotate(14deg) scaleX(0.95); }
      100% { transform: rotate(-22deg) scaleX(1.04); }
    }
    .bat-eyes {
      transform-origin: 605px 248px;
      animation: blinkEyes 4.6s ease-in-out infinite;
    }

    /* Skunk & Popcorn Animations */
    .skunk-group {
      cursor: pointer;
      transform-origin: 865px 470px;
    }
    .skunk-group.react {
      animation: charPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .skunk-tail {
      transform-origin: 930px 475px;
      animation: skunkTailBob 2.8s ease-in-out infinite;
    }
    @keyframes skunkTailBob {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(6deg); }
    }
    .skunk-eyes {
      transform-origin: 855px 362px;
      animation: blinkEyes 3.9s ease-in-out infinite;
    }
    .popcorn-juggle {
      transform-origin: 830px 475px;
      animation: popcornWobble 2.6s ease-in-out infinite;
    }
    @keyframes popcornWobble {
      0%, 100% { transform: rotate(-3deg) translateY(0px); }
      30% { transform: rotate(5deg) translateY(-5px); }
      55% { transform: rotate(-11deg) translateY(3px); }
      75% { transform: rotate(8deg) translateY(-6px); }
    }

    .kernel-1 { animation: kernelArc1 2.6s ease-in-out infinite; }
    .kernel-2 { animation: kernelArc2 2.6s ease-in-out infinite 0.35s; }
    .kernel-3 { animation: kernelArc3 2.6s ease-in-out infinite 0.7s; }

    @keyframes kernelArc1 {
      0%, 20% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      30% { opacity: 1; }
      65% { transform: translate(-45px, -68px) rotate(160deg); opacity: 1; }
      92% { transform: translate(-75px, 65px) rotate(310deg); opacity: 1; }
      100% { transform: translate(-80px, 72px) rotate(330deg); opacity: 0; }
    }
    @keyframes kernelArc2 {
      0%, 20% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      30% { opacity: 1; }
      60% { transform: translate(28px, -78px) rotate(-140deg); opacity: 1; }
      92% { transform: translate(48px, 68px) rotate(-290deg); opacity: 1; }
      100% { transform: translate(52px, 74px) rotate(-310deg); opacity: 0; }
    }
    @keyframes kernelArc3 {
      0%, 25% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      35% { opacity: 1; }
      65% { transform: translate(-12px, -88px) rotate(120deg); opacity: 1; }
      95% { transform: translate(-22px, 54px) rotate(240deg); opacity: 1; }
      100% { transform: translate(-24px, 60px) rotate(260deg); opacity: 0; }
    }

    .sweat-drop {
      animation: sweatPulse 2.6s ease-in-out infinite;
    }
    @keyframes sweatPulse {
      0%, 40%, 100% { opacity: 0; transform: translateY(-4px); }
      55%, 80% { opacity: 0.95; transform: translateY(3px); }
    }

    @keyframes blinkEyes {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    @keyframes charPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.06, 0.95); }
      100% { transform: scale(1); }
    }

    @media (max-width: 640px) {
      .speech-bubble {
        max-width: 36%;
        padding: 7px 10px;
        border-width: 2px;
        border-radius: 13px;
      }
      #bubble-fox { left: 24%; top: 18%; }
      #bubble-bat { left: 52%; top: 6%; }
      #bubble-skunk { left: 77%; top: 18%; }
    }
  </style>
</head>
<body>
  <main class="stage-wrapper">
    <header class="header-bar">
      <div class="title-group">
        <h1>Movie Night!</h1>
        <p>Click any character or use the controls to follow their movie-night banter.</p>
      </div>
      <div class="controls">
        <button id="btn-prev" class="btn" type="button">Prev</button>
        <button id="btn-next" class="btn primary" type="button">Next Line</button>
        <button id="btn-toggle" class="btn" type="button">Pause</button>
        <button id="btn-replay" class="btn" type="button">Replay</button>
      </div>
    </header>

    <section class="scene-card" aria-label="Animated movie night living room scene">
      <svg class="scene-svg" viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#35285c" />
            <stop offset="100%" stop-color="#4e397a" />
          </linearGradient>
          <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6b442a" />
            <stop offset="100%" stop-color="#4a2d1b" />
          </linearGradient>
          <linearGradient id="sofaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2ec4b6" />
            <stop offset="100%" stop-color="#1b9aaa" />
          </linearGradient>
          <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffd166" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#ffd166" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Living Room Wall & Floor -->
        <rect x="0" y="0" width="1200" height="530" fill="url(#wallGrad)" />
        <rect x="0" y="518" width="1200" height="16" fill="#2c204a" stroke="#1e1b2e" stroke-width="4" />
        <rect x="0" y="534" width="1200" height="206" fill="url(#floorGrad)" />
        <!-- Floorboard lines -->
        <g stroke="#3a2214" stroke-width="3" opacity="0.55">
          <line x1="0" y1="585" x2="1200" y2="585" />
          <line x1="0" y1="645" x2="1200" y2="645" />
          <line x1="220" y1="534" x2="170" y2="740" />
          <line x1="560" y1="534" x2="540" y2="740" />
          <line x1="920" y1="534" x2="970" y2="740" />
        </g>

        <!-- Cozy Rug -->
        <ellipse cx="600" cy="655" rx="455" ry="72" fill="#e76f51" stroke="#1e1b2e" stroke-width="4.5" />
        <ellipse cx="600" cy="655" rx="395" ry="52" fill="#f4a261" stroke="#1e1b2e" stroke-width="3.5" stroke-dasharray="14 10" />
        <ellipse cx="600" cy="655" rx="320" ry="34" fill="#e9c46a" opacity="0.85" />

        <!-- Wall Poster (Left) -->
        <g transform="translate(115, 92)">
          <rect x="0" y="0" width="136" height="176" rx="10" fill="#ffd166" stroke="#1e1b2e" stroke-width="4.5" />
          <rect x="12" y="12" width="112" height="152" rx="5" fill="#231942" stroke="#1e1b2e" stroke-width="3" />
          <circle cx="68" cy="68" r="30" fill="#ff6b6b" />
          <polygon points="68,45 75,62 93,62 79,72 84,89 68,79 52,89 57,72 43,62 61,62" fill="#ffd166" />
          <rect x="26" y="114" width="84" height="10" rx="5" fill="#fff8ec" />
          <rect x="38" y="132" width="60" height="8" rx="4" fill="#9b5de5" />
        </g>

        <!-- Wall Shelf & Plant (Right) -->
        <g transform="translate(940, 145)">
          <rect x="0" y="65" width="170" height="18" rx="7" fill="#d48c46" stroke="#1e1b2e" stroke-width="4" />
          <!-- Potted Plant -->
          <path d="M26,65 L34,26 L68,26 L76,65 Z" fill="#ff6b6b" stroke="#1e1b2e" stroke-width="3.5" />
          <path d="M51,26 C35,5 20,14 34,28" fill="#52b788" stroke="#1e1b2e" stroke-width="3.5" />
          <path d="M51,26 C52,0 72,2 64,26" fill="#74c69d" stroke="#1e1b2e" stroke-width="3.5" />
          <path d="M51,26 C68,12 85,22 68,32" fill="#40916c" stroke="#1e1b2e" stroke-width="3.5" />
          <!-- Film Reel -->
          <circle cx="128" cy="36" r="28" fill="#adb5bd" stroke="#1e1b2e" stroke-width="3.5" />
          <circle cx="128" cy="36" r="8" fill="#1e1b2e" />
          <circle cx="128" cy="18" r="5" fill="#2b2248" />
          <circle cx="128" cy="54" r="5" fill="#2b2248" />
          <circle cx="110" cy="36" r="5" fill="#2b2248" />
          <circle cx="146" cy="36" r="5" fill="#2b2248" />
        </g>

        <!-- String Fairy Lights -->
        <path d="M0,45 Q300,105 600,52 T1200,48" fill="none" stroke="#1e1b2e" stroke-width="4" />
        <g>
          <circle class="fairy-bulb" cx="110" cy="67" r="9" fill="#ffd166" stroke="#1e1b2e" stroke-width="3" />
          <circle class="fairy-bulb" cx="235" cy="79" r="9" fill="#ff6b6b" stroke="#1e1b2e" stroke-width="3" />
          <circle class="fairy-bulb" cx="370" cy="77" r="9" fill="#5ce1e6" stroke="#1e1b2e" stroke-width="3" />
          <circle class="fairy-bulb" cx="505" cy="63" r="9" fill="#ffd166" stroke="#1e1b2e" stroke-width="3" />
          <circle class="fairy-bulb" cx="655" cy="45" r="9" fill="#c77dff" stroke="#1e1b2e" stroke-width="3" />
          <circle class="fairy-bulb" cx="800" cy="37" r="9" fill="#5ce1e6" stroke="#1e1b2e" stroke-width="3" />
          <circle class="fairy-bulb" cx="950" cy="42" r="9" fill="#ffd166" stroke="#1e1b2e" stroke-width="3" />
          <circle class="fairy-bulb" cx="1090" cy="48" r="9" fill="#ff6b6b" stroke="#1e1b2e" stroke-width="3" />
        </g>

        <!-- Warm Corner Floor Lamp -->
        <circle cx="118" cy="370" r="115" fill="url(#lampGlow)" />
        <rect x="92" y="370" width="12" height="205" fill="#3a3356" stroke="#1e1b2e" stroke-width="4" />
        <ellipse cx="98" cy="576" rx="34" ry="11" fill="#3a3356" stroke="#1e1b2e" stroke-width="4" />
        <polygon points="56,374 140,374 124,310 72,310" fill="#ffd166" stroke="#1e1b2e" stroke-width="4.5" stroke-linejoin="round" />

        <!-- Plush Living Room Couch (Backrest & Cushions) -->
        <g id="couch">
          <!-- Wooden legs -->
          <rect x="212" y="574" width="22" height="32" rx="6" fill="#5c3721" stroke="#1e1b2e" stroke-width="4" />
          <rect x="966" y="574" width="22" height="32" rx="6" fill="#5c3721" stroke="#1e1b2e" stroke-width="4" />
          <!-- Backrest -->
          <rect x="195" y="348" width="810" height="175" rx="44" fill="url(#sofaGrad)" stroke="#1e1b2e" stroke-width="5" />
          <!-- Backrest seam -->
          <line x1="600" y1="364" x2="600" y2="486" stroke="#157a85" stroke-width="4" stroke-linecap="round" />
          <!-- Throw Pillow (Left) -->
          <rect x="235" y="405" width="76" height="72" rx="18" transform="rotate(-10 273 441)" fill="#ffd166" stroke="#1e1b2e" stroke-width="4" />
          <!-- Throw Pillow (Center) -->
          <rect x="556" y="408" width="74" height="68" rx="18" transform="rotate(7 593 442)" fill="#ff6b6b" stroke="#1e1b2e" stroke-width="4" />
        </g>

        <!-- ==================== CHARACTER 1: SUAVE FOX ==================== -->
        <g id="char-fox" class="fox-group">
          <!-- Bushy Swaying Tail -->
          <g class="fox-tail">
            <path d="M242,486 C168,462 146,385 198,354 C232,334 256,382 252,440 Z" fill="#ff7a2f" stroke="#1e1b2e" stroke-width="4.5" stroke-linejoin="round" />
            <path d="M174,384 C178,360 198,350 218,358 C222,374 206,392 184,394 Z" fill="#fff3df" stroke="#1e1b2e" stroke-width="4" stroke-linejoin="round" />
          </g>

          <!-- Fox Body (lounging confidently) -->
          <path d="M262,488 C258,425 288,392 332,394 C376,396 394,435 388,494 Z" fill="#ff7a2f" stroke="#1e1b2e" stroke-width="4.5" />
          <!-- Cream Chest -->
          <path d="M302,402 C328,402 350,425 352,486 L296,486 C292,445 294,415 302,402 Z" fill="#fff3df" stroke="#1e1b2e" stroke-width="3.5" />
          <!-- Relaxed Arm on Cushion -->
          <path d="M276,435 C255,442 246,466 266,474 C284,480 296,465 295,448" fill="#ff7a2f" stroke="#1e1b2e" stroke-width="4.5" stroke-linecap="round" />
          <path d="M364,432 C388,442 406,464 388,478 C374,488 358,474 358,456" fill="#ff7a2f" stroke="#1e1b2e" stroke-width="4.5" stroke-linecap="round" />

          <!-- Fox Head -->
          <g>
            <!-- Left Ear -->
            <polygon points="282,334 268,266 322,304" fill="#ff7a2f" stroke="#1e1b2e" stroke-width="4.5" stroke-linejoin="round" />
            <polygon points="286,322 278,282 312,306" fill="#2e243d" />
            <!-- Right Ear (twitches) -->
            <g class="fox-ear-r">
              <polygon points="342,304 390,264 378,334" fill="#ff7a2f" stroke="#1e1b2e" stroke-width="4.5" stroke-linejoin="round" />
              <polygon points="348,306 380,280 372,322" fill="#2e243d" />
            </g>
            <!-- Head Shape -->
            <path d="M268,354 C268,310 302,294 332,294 C362,294 394,310 394,354 C394,394 356,412 332,412 C308,412 268,394 268,354 Z" fill="#ff7a2f" stroke="#1e1b2e" stroke-width="4.5" />
            <!-- Cream Cheeks -->
            <path d="M270,360 C292,356 312,374 332,410 C298,410 272,390 270,360 Z" fill="#fff3df" stroke="#1e1b2e" stroke-width="3.5" />
            <path d="M392,360 C370,356 350,374 332,410 C366,410 390,390 392,360 Z" fill="#fff3df" stroke="#1e1b2e" stroke-width="3.5" />

  <script>
    const DIALOGUE = [
      { speaker: 'bat',   name: 'Pip the Bat',  text: 'Ooh! The trailers are starting! Turn it up, turn it up!' },
      { speaker: 'fox',   name: 'Félix the Fox', text: 'Relax, Pip. Every great film deserves a dramatic entrance.' },
      { speaker: 'skunk', name: 'Barnaby',      text: 'I brought extra buttered popcorn! Wait—whoa, slippery bucket!' },
      { speaker: 'bat',   name: 'Pip the Bat',  text: 'Whoa, airborne popcorn! Catching it mid-flight counts as dinner!' },
      { speaker: 'fox',   name: 'Félix the Fox', text: 'Ten out of ten for style, Barnaby. Zero for structural integrity.' },
      { speaker: 'skunk', name: 'Barnaby',      text: 'Hey! At least the couch cushions are getting a snack too… right?' },
      { speaker: 'bat',   name: 'Pip the Bat',  text: 'Shhh! Look at that glowing spaceship! Here comes the hero!' },
      { speaker: 'fox',   name: 'Félix the Fox', text: 'Alright, crew—eyes on the screen. Best movie night yet.' }
    ];

    const bubbles = {
      fox: document.getElementById('bubble-fox'),
      bat: document.getElementById('bubble-bat'),
      skunk: document.getElementById('bubble-skunk')
    };

    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnToggle = document.getElementById('btn-toggle');
    const btnReplay = document.getElementById('btn-replay');
    const lineCounter = document.getElementById('line-counter');
    const playbackStatus = document.getElementById('playback-status');

    let currentIndex = 0;
    let isPlaying = true;
    let timerId = null;

    function renderLine(index) {
      currentIndex = (index + DIALOGUE.length) % DIALOGUE.length;
      const entry = DIALOGUE[currentIndex];

      Object.entries(bubbles).forEach(([key, el]) => {
        if (key === entry.speaker) {
          el.innerHTML = `<span class="speaker-tag speaker-${key}">${entry.name}</span>${entry.text}`;
          el.classList.add('visible');
        } else {
          el.classList.remove('visible');
        }
      });

      lineCounter.textContent = `Line ${currentIndex + 1} of ${DIALOGUE.length}`;
    }

    function scheduleNext() {
      clearTimeout(timerId);
      if (!isPlaying) return;
      timerId = setTimeout(() => {
        renderLine(currentIndex + 1);
        scheduleNext();
      }, 4200);
    }

    function stepTo(index) {
      renderLine(index);
      scheduleNext();
    }

    function togglePlayback() {
      isPlaying = !isPlaying;
      btnToggle.textContent = isPlaying ? 'Pause' : 'Play';
      playbackStatus.textContent = isPlaying ? 'Auto-playing' : 'Paused';
      if (isPlaying) {
        scheduleNext();
      } else {
        clearTimeout(timerId);
      }
    }

    function triggerCharacterReaction(charId, speakerKey) {
      const group = document.getElementById(charId);
      if (group) {
        group.classList.remove('react');
        void group.offsetWidth;
        group.classList.add('react');
      }
      const nextForSpeaker = DIALOGUE.findIndex((item, idx) => idx > currentIndex && item.speaker === speakerKey);
      const fallbackForSpeaker = DIALOGUE.findIndex((item) => item.speaker === speakerKey);
      stepTo(nextForSpeaker !== -1 ? nextForSpeaker : fallbackForSpeaker);
    }

    btnPrev.addEventListener('click', () => stepTo(currentIndex - 1));
    btnNext.addEventListener('click', () => stepTo(currentIndex + 1));
    btnToggle.addEventListener('click', togglePlayback);
    btnReplay.addEventListener('click', () => {
      if (!isPlaying) togglePlayback();
      stepTo(0);
    });

    Object.values(bubbles).forEach((el) => {
      el.addEventListener('click', () => stepTo(currentIndex + 1));
    });

    document.getElementById('char-fox').addEventListener('click', () => triggerCharacterReaction('char-fox', 'fox'));
    document.getElementById('char-bat').addEventListener('click', () => triggerCharacterReaction('char-bat', 'bat'));
    document.getElementById('char-skunk').addEventListener('click', () => triggerCharacterReaction('char-skunk', 'skunk'));

    renderLine(0);
    scheduleNext();
  </script>
