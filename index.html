<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Night — Sunny Fox, Luna Bat & PoppyDash</title>
  <meta name="description" content="An interactive cartoon movie night animation starring Sunny Fox, Luna Bat, and PoppyDash with character voices and physical comedy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-night: #17142b;
      --bg-deep: #0f0d1e;
      --ink: #1e1b2e;
      --cream: #fff8ec;
      --gold: #ffd166;
      --coral: #ff6b6b;
      --teal: #2ec4b6;
      --purple: #9b5de5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at 50% 25%, #2b2352 0%, var(--bg-night) 55%, var(--bg-deep) 100%);
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      color: var(--cream);
      overflow-x: hidden;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 4px;
    }

    .title-group h1 {
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: clamp(1.35rem, 2.8vw, 1.95rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--gold);
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    }

    .title-group p {
      font-size: 0.92rem;
      color: #c8c2e6;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      appearance: none;
      border: 2.5px solid var(--ink);
      background: var(--cream);
      color: var(--ink);
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
    }

    .btn:hover {
      background: var(--gold);
      transform: translateY(-1px);
      box-shadow: 0 4px 0 var(--ink);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .btn.primary {
      background: var(--gold);
    }

    .btn.accent {
      background: #ff8fa3;
    }

    .btn.accent:hover {
      background: #ff758f;
    }

    .btn.muted {
      background: #d8d4ea;
      color: #4b4668;
    }

    .scene-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1200 / 740;
      border-radius: 24px;
      overflow: hidden;
      border: 4px solid var(--ink);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #2b2248;
      user-select: none;
    }

    .scene-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Animated TV Screen Light Glow Overlay */
    .tv-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.36;
      animation: tvColorShift 9s ease-in-out infinite alternate;
    }

    @keyframes tvColorShift {
      0% {
        background: radial-gradient(ellipse at 50% 95%, rgba(92, 225, 230, 0.72) 0%, rgba(92, 225, 230, 0.16) 48%, transparent 78%);
      }
      33% {
        background: radial-gradient(ellipse at 48% 95%, rgba(255, 209, 102, 0.68) 0%, rgba(255, 140, 105, 0.18) 48%, transparent 78%);
      }
      66% {
        background: radial-gradient(ellipse at 52% 95%, rgba(167, 139, 250, 0.7) 0%, rgba(244, 114, 182, 0.18) 48%, transparent 78%);
      }
      100% {
        background: radial-gradient(ellipse at 50% 95%, rgba(74, 222, 128, 0.62) 0%, rgba(56, 189, 248, 0.18) 48%, transparent 78%);
      }
    }

    /* Start Sound Banner (unlocks browser SpeechSynthesis + WebAudio cleanly) */
    .start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 24px;
      background: linear-gradient(to top, rgba(15, 13, 30, 0.65) 0%, transparent 45%);
      z-index: 5;
      transition: opacity 0.25s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-cta {
      appearance: none;
      border: 3.5px solid var(--ink);
      background: var(--gold);
      color: var(--ink);
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--ink), 0 12px 28px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: ctaPulse 2.2s ease-in-out infinite;
    }

    .start-cta:hover {
      transform: translateY(-2px) scale(1.03);
      background: #ffe08a;
    }

    .start-cta:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    @keyframes ctaPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    /* Speech Bubbles Layer */
    .bubbles-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .speech-bubble {
      position: absolute;
      max-width: min(275px, 30%);
      background: #ffffff;
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 10px 14px;
      font-size: clamp(0.72rem, 1.35vw, 0.94rem);
      font-weight: 700;
      line-height: 1.32;
      box-shadow: 0 5px 0 rgba(30, 27, 46, 0.9);
      opacity: 0;
      transform: translate(-50%, -8px) scale(0.86);
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.4s ease, left 0.4s ease;
      pointer-events: auto;
      cursor: pointer;
    }

    .speech-bubble.visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 10px 0 10px;
      border-style: solid;
      border-color: var(--ink) transparent transparent transparent;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 8px 0 8px;
      border-style: solid;
      border-color: #ffffff transparent transparent transparent;
      z-index: 1;
    }

    .speaker-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: 0.74em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .speaker-fox { color: #e85d04; }
    .speaker-bat { color: #7b2cbf; }
    .speaker-skunk { color: #d62828; }

    #bubble-fox { left: 27%; top: 18%; }
    #bubble-bat { left: 52%; top: 7%; }
    #bubble-skunk { left: 75%; top: 20%; }
    #bubble-skunk.low-pose { left: 77%; top: 44%; }

    .dialogue-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: #bdb6de;
      padding: 0 4px;
    }

    .voice-Cast {
      font-size: 0.8rem;
      color: #9e97c4;
    }

    /* ==================== SCENE & CHARACTER ANIMATIONS ==================== */
    .fairy-bulb {
      animation: twinkle 2.4s ease-in-out infinite alternate;
    }
    .fairy-bulb:nth-child(even) {
      animation-delay: 1.1s;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.65; filter: brightness(0.95); }
      50% { opacity: 1; filter: brightness(1.3); }
    }

    /* Talking Mouths */
    .mouth-talking { display: none; }
    .is-talking .mouth-idle { display: none; }
    .is-talking .mouth-talking {
      display: block;
      animation: mouthChatter 0.24s ease-in-out infinite alternate;
    }
    @keyframes mouthChatter {
      0% { transform: scaleY(0.55); }
      100% { transform: scaleY(1.15); }
    }

    /* ---------- SUNNY FOX (WOMAN) ---------- */
    .fox-group {
      cursor: pointer;
      transform-origin: 330px 490px;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fox-group.state-peek {
      transform: translate(24px, 6px) rotate(9deg);
    }
    .fox-group.state-wave {
      transform: translate(-4px, -4px) rotate(-2deg);
    }
    .fox-group.react {
      animation: charPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fox-tail {
      transform-origin: 252px 482px;
      animation: foxTailSway 3.4s ease-in-out infinite;
    }
    @keyframes foxTailSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(9deg); }
    }
    .fox-ear-r {
      transform-origin: 356px 312px;
      animation: earTwitch 5s ease-in-out infinite;
    }
    @keyframes earTwitch {
      0%, 84%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(8deg); }
      92% { transform: rotate(-3deg); }
    }
    .fox-wink-eye {
      transform-origin: 354px 352px;
      animation: foxWink 5.2s ease-in-out infinite;
    }
    @keyframes foxWink {
      0%, 74%, 84%, 100% { transform: scaleY(1); }
      79% { transform: scaleY(0.12); }
    }
    .fox-gesture-arm {
      transform-origin: 368px 426px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fox-group.is-talking .fox-gesture-arm,
    .fox-group.state-wave .fox-gesture-arm {
      animation: foxArmGesture 0.85s ease-in-out infinite alternate;
    }
    @keyframes foxArmGesture {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(-22deg) translateY(-4px); }
    }
    .fox-mouth-talk-origin { transform-origin: 332px 390px; }

    /* ---------- LUNA BAT (GIRL — EXTRA CUTE) ---------- */
    .bat-group {
      cursor: pointer;
      transform-origin: 605px 235px;
      animation: batSwoopIdle 4.8s ease-in-out infinite;
    }
    .bat-group.state-chase {
      animation: batChasePopcorn 2.2s ease-in-out infinite;
    }
    .bat-group.state-flip {
      animation: batHappyFlip 1.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bat-group.state-perch {
      animation: batPerchBounce 1.8s ease-in-out infinite;
    }

    @keyframes batSwoopIdle {
      0%, 100% { transform: translate(0px, 0px) rotate(-3deg); }
      25% { transform: translate(42px, -24px) rotate(6deg); }
      50% { transform: translate(8px, 8px) rotate(-1deg); }
      75% { transform: translate(-44px, -20px) rotate(-7deg); }
    }
    @keyframes batChasePopcorn {
      0%, 100% { transform: translate(40px, 16px) rotate(6deg) scale(1.04); }
      35% { transform: translate(135px, 68px) rotate(-12deg) scale(1.08); }
      70% { transform: translate(75px, -14px) rotate(10deg) scale(1); }
    }
    @keyframes batHappyFlip {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      45% { transform: translate(18px, -36px) rotate(195deg) scale(1.12); }
      100% { transform: translate(0, 0) rotate(360deg) scale(1); }
    }
    @keyframes batPerchBounce {
      0%, 100% { transform: translate(-18px, 84px) rotate(0deg); }
      50% { transform: translate(-18px, 70px) rotate(3deg); }
    }

    .bat-wing-l {
      transform-origin: 572px 248px;
      animation: wingFlapL 0.36s ease-in-out infinite alternate;
    }
    .bat-wing-r {
      transform-origin: 638px 248px;
      animation: wingFlapR 0.36s ease-in-out infinite alternate;
    }
    @keyframes wingFlapL {
      0% { transform: rotate(-16deg) scaleX(0.95); }
      100% { transform: rotate(24deg) scaleX(1.05); }
    }
    @keyframes wingFlapR {
      0% { transform: rotate(16deg) scaleX(0.95); }
      100% { transform: rotate(-24deg) scaleX(1.05); }
    }
    .bat-eyes {
      transform-origin: 605px 226px;
      animation: blinkEyes 4.4s ease-in-out infinite;
    }
    .bat-feet {
      transform-origin: 605px 282px;
      animation: feetKick 0.7s ease-in-out infinite alternate;
    }
    @keyframes feetKick {
      0% { transform: rotate(-6deg); }
      100% { transform: rotate(7deg); }
    }
    .bat-mouth-talk-origin { transform-origin: 605px 248px; }

    /* ---------- POPPYDASH THE SKUNK (MAN — PHYSICAL COMEDY) ---------- */
    .skunk-group {
      cursor: pointer;
      transform-origin: 855px 465px;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .skunk-group.state-wobble {
      animation: skunkPanicWobble 0.65s ease-in-out infinite;
    }
    @keyframes skunkPanicWobble {
      0%, 100% { transform: rotate(-5deg) translateX(-4px); }
      50% { transform: rotate(8deg) translateX(8px) translateY(-4px); }
    }
    .skunk-group.state-fall {
      transform: translate(32px, 152px) rotate(-102deg);
      transition: transform 0.58s cubic-bezier(0.55, 0.055, 0.675, 0.19);
    }
    .skunk-group.state-recover {
      transform: translate(12px, 84px) rotate(-6deg) scale(0.96);
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .skunk-group.react {
      animation: charPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .skunk-tail {
      transform-origin: 906px 476px;
      animation: skunkTailBob 2.6s ease-in-out infinite;
    }
    @keyframes skunkTailBob {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(7deg); }
    }
    .skunk-eyes {
      transform-origin: 854px 356px;
      animation: blinkEyes 3.9s ease-in-out infinite;
    }
    .skunk-mouth-talk-origin { transform-origin: 854px 388px; }

    /* Dizzy stars & nose kernel during/after fall */
    .dizzy-stars {
      opacity: 0;
      transform-origin: 854px 295px;
      transition: opacity 0.25s ease;
    }
    .skunk-group.state-fall .dizzy-stars {
      opacity: 1;
      animation: spinStars 1.4s linear infinite;
    }
    @keyframes spinStars {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .nose-kernel {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .skunk-group.state-recover .nose-kernel {
      opacity: 1;
    }

    /* Popcorn Bucket & Spill Physics */
    .popcorn-juggle {
      transform-origin: 825px 465px;
      animation: popcornWobble 2.2s ease-in-out infinite;
      transition: transform 0.5s ease, opacity 0.35s ease;
    }
    .skunk-group.state-wobble .popcorn-juggle {
      animation: popcornWildWobble 0.45s ease-in-out infinite alternate;
    }
    .skunk-group.state-fall .popcorn-juggle {
      animation: none;
      transform: translate(-115px, -65px) rotate(-145deg);
    }
    .skunk-group.state-recover .popcorn-juggle {
      animation: none;
      opacity: 0.25;
      transform: translate(-30px, 75px) rotate(-20deg) scale(0.8);
    }

    @keyframes popcornWobble {
      0%, 100% { transform: rotate(-3deg) translateY(0px); }
      50% { transform: rotate(6deg) translateY(-5px); }
    }
    @keyframes popcornWildWobble {
      0% { transform: rotate(-16deg) translate(-6px, -4px); }
      100% { transform: rotate(18deg) translate(8px, -10px); }
    }

    /* Big Popcorn Shower FX */
    .spill-shower {
      opacity: 0;
      pointer-events: none;
    }
    .spill-shower.active {
      opacity: 1;
    }
    .spill-shower.active .shower-k {
      animation-duration: 1.45s;
      animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
      animation-fill-mode: forwards;
    }
    .spill-shower.active .sk1 { animation-name: showerFly1; }
    .spill-shower.active .sk2 { animation-name: showerFly2; }
    .spill-shower.active .sk3 { animation-name: showerFly3; }
    .spill-shower.active .sk4 { animation-name: showerFly4; }
    .spill-shower.active .sk5 { animation-name: showerFly5; }
    .spill-shower.active .sk6 { animation-name: showerFly6; }
    .spill-shower.active .sk7 { animation-name: showerFly7; }
    .spill-shower.active .sk8 { animation-name: showerFly8; }
    .spill-shower.active .sk9 { animation-name: showerFly9; }
    .spill-shower.active .sk10 { animation-name: showerFly10; }

    @keyframes showerFly1 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(-155px, -170px) rotate(180deg) scale(1.1); opacity: 1; }
      100% { transform: translate(-245px, 165px) rotate(360deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly2 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(-95px, -210px) rotate(-150deg) scale(1.15); opacity: 1; }
      100% { transform: translate(-140px, 180px) rotate(-320deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly3 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(-35px, -230px) rotate(120deg) scale(1.1); opacity: 1; }
      100% { transform: translate(-55px, 195px) rotate(280deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly4 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(35px, -195px) rotate(-140deg) scale(1.15); opacity: 1; }
      100% { transform: translate(65px, 210px) rotate(-300deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly5 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(115px, -165px) rotate(200deg) scale(1.05); opacity: 1; }
      100% { transform: translate(170px, 200px) rotate(380deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly6 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(-215px, -125px) rotate(-180deg) scale(1.1); opacity: 1; }
      100% { transform: translate(-340px, 145px) rotate(-350deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly7 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(-120px, -150px) rotate(140deg) scale(1.1); opacity: 1; }
      100% { transform: translate(-185px, 75px) rotate(290deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly8 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(10px, -140px) rotate(-110deg) scale(1.1); opacity: 1; }
      100% { transform: translate(20px, 90px) rotate(-250deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly9 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(90px, -130px) rotate(160deg) scale(1.1); opacity: 1; }
      100% { transform: translate(120px, 130px) rotate(320deg) scale(1); opacity: 1; }
    }
    @keyframes showerFly10 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      45% { transform: translate(-295px, -145px) rotate(170deg) scale(1.1); opacity: 1; }
      100% { transform: translate(-420px, 125px) rotate(340deg) scale(1); opacity: 1; }
    }

    .sweat-drop {
      animation: sweatPulse 2.4s ease-in-out infinite;
    }
    @keyframes sweatPulse {
      0%, 40%, 100% { opacity: 0; transform: translateY(-4px); }
      55%, 80% { opacity: 0.95; transform: translateY(3px); }
    }

    @keyframes blinkEyes {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    @keyframes charPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.06, 0.95); }
      100% { transform: scale(1); }
    }

    @media (max-width: 640px) {
      .speech-bubble {
        max-width: 38%;
        padding: 7px 10px;
        border-width: 2px;
        border-radius: 13px;
      }
      #bubble-fox { left: 25%; top: 15%; }
      #bubble-bat { left: 52%; top: 5%; }
      #bubble-skunk { left: 76%; top: 15%; }
      #bubble-skunk.low-pose { left: 76%; top: 42%; }
    }
  </style>
</head>
<body>
  <main class="stage-wrapper">
    <header class="header-bar">
      <div class="title-group">
        <h1>Movie Night!</h1>
        <p>Starring Sunny Fox, Luna Bat &amp; PoppyDash — click any character or trigger the popcorn spill!</p>
      </div>
      <div class="controls">
        <button id="btn-prev" class="btn" type="button">Prev</button>
        <button id="btn-next" class="btn primary" type="button">Next Line</button>
        <button id="btn-spill" class="btn accent" type="button">Spill Popcorn!</button>
        <button id="btn-voice" class="btn" type="button">Voices: On</button>
        <button id="btn-toggle" class="btn" type="button">Pause</button>
        <button id="btn-replay" class="btn" type="button">Replay</button>
      </div>
    </header>

    <section class="scene-card" aria-label="Animated movie night living room scene">
      <svg class="scene-svg" viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">

  <script>
    const DIALOGUE = [
      {
        speaker: 'bat',
        name: 'Luna Bat',
        text: 'Ooh! The trailers are starting! Turn it up, turn it up!',
        foxState: 'state-wave',
        batState: 'state-perch',
        skunkState: ''
      },
      {
        speaker: 'fox',
        name: 'Sunny Fox',
        text: 'Relax, Luna. Every great film deserves a stylish entrance.',
        foxState: 'state-wave',
        batState: '',
        skunkState: ''
      },
      {
        speaker: 'skunk',
        name: 'PoppyDash',
        text: 'I brought extra buttered popcorn! Wait—whoa, slippery bucket!',
        foxState: '',
        batState: '',
        skunkState: 'state-wobble'
      },
      {
        speaker: 'skunk',
        name: 'PoppyDash',
        text: 'Whoooa—look out below! My popcorn! My dignity!',
        foxState: 'state-peek',
        batState: 'state-chase',
        skunkState: 'state-fall',
        triggerSpill: true
      },
      {
        speaker: 'bat',
        name: 'Luna Bat',
        text: 'Wheee! Airborne popcorn! Catching it mid-flight counts as dinner!',
        foxState: 'state-peek',
        batState: 'state-flip',
        skunkState: 'state-fall'
      },
      {
        speaker: 'fox',
        name: 'Sunny Fox',
        text: 'Ten out of ten for the tumble, PoppyDash. Zero for balance.',
        foxState: 'state-peek',
        batState: 'state-chase',
        skunkState: 'state-recover'
      },
      {
        speaker: 'skunk',
        name: 'PoppyDash',
        text: 'Hey! At least there is a kernel on my nose for later… right?',
        foxState: '',
        batState: '',
        skunkState: 'state-recover'
      },
      {
        speaker: 'fox',
        name: 'Sunny Fox',
        text: 'Alright, crew—eyes on the screen. Best movie night yet!',
        foxState: 'state-wave',
        batState: 'state-perch',
        skunkState: ''
      }
    ];

    const bubbles = {
      fox: document.getElementById('bubble-fox'),
      bat: document.getElementById('bubble-bat'),
      skunk: document.getElementById('bubble-skunk')
    };

    const chars = {
      fox: document.getElementById('char-fox'),
      bat: document.getElementById('char-bat'),
      skunk: document.getElementById('char-skunk')
    };

    const spillFx = document.getElementById('spill-popcorn-fx');
    const startOverlay = document.getElementById('start-overlay');
    const btnStartSound = document.getElementById('btn-start-sound');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSpill = document.getElementById('btn-spill');
    const btnVoice = document.getElementById('btn-voice');
    const btnToggle = document.getElementById('btn-toggle');
    const btnReplay = document.getElementById('btn-replay');
    const lineCounter = document.getElementById('line-counter');
    const playbackStatus = document.getElementById('playback-status');

    let currentIndex = 0;
    let isPlaying = true;
    let voicesEnabled = true;
    let audioUnlocked = false;
    let timerId = null;
    let audioCtx = null;

    // ==================== PROCEDURAL WEB AUDIO SFX ====================
    function ensureAudioCtx() {
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playPopcornSpillSfx() {
      if (!voicesEnabled || !audioUnlocked) return;
      const ctx = ensureAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      // Comedic slide whistle down + soft thud
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(580, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.48);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.52);

      // Soft thud at landing
      const thud = ctx.createOscillator();
      const thudGain = ctx.createGain();
      thud.type = 'triangle';
      thud.frequency.setValueAtTime(135, now + 0.42);
      thud.frequency.exponentialRampToValueAtTime(48, now + 0.62);
      thudGain.gain.setValueAtTime(0.24, now + 0.42);
      thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
      thud.connect(thudGain).connect(ctx.destination);
      thud.start(now + 0.42);
      thud.stop(now + 0.66);

      // Popcorn pop bursts
      for (let i = 0; i < 6; i++) {
        const t = now + 0.12 + i * 0.09;
        const popOsc = ctx.createOscillator();
        const popGain = ctx.createGain();
        popOsc.type = 'sine';
        popOsc.frequency.setValueAtTime(340 + i * 65, t);
        popOsc.frequency.exponentialRampToValueAtTime(860 + i * 40, t + 0.045);
        popGain.gain.setValueAtTime(0.09, t);
        popGain.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
        popOsc.connect(popGain).connect(ctx.destination);
        popOsc.start(t);
        popOsc.stop(t + 0.06);
      }
    }

    function playBatFlutterSfx() {
      if (!voicesEnabled || !audioUnlocked) return;
      const ctx = ensureAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      [520, 660, 780].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);
        gain.gain.setValueAtTime(0.06, now + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.09);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + idx * 0.06);
        osc.stop(now + idx * 0.06 + 0.1);
      });
    }

    // ==================== CHARACTER VOICE ACTING (WEB SPEECH API) ====================
    const VoiceManager = (() => {
      let availableVoices = [];

      function refreshVoices() {
        if (!('speechSynthesis' in window)) return;
        availableVoices = window.speechSynthesis.getVoices() || [];
      }

      if ('speechSynthesis' in window) {
        refreshVoices();
        window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
      }

      function pickVoice(role) {
        if (!availableVoices.length) return null;
        const english = availableVoices.filter((v) => v.lang && v.lang.toLowerCase().startsWith('en'));
        const pool = english.length ? english : availableVoices;

        const femaleHints = ['samantha', 'victoria', 'karen', 'moira', 'tessa', 'fiona', 'kate', 'serena', 'zira', 'hazel', 'susan', 'aria', 'jenny', 'sara', 'michelle', 'emma', 'olivia', 'female', 'woman', 'girl'];
        const maleHints = ['daniel', 'alex', 'fred', 'tom', 'oliver', 'rishi', 'david', 'mark', 'guy', 'ryan', 'christopher', 'eric', 'arthur', 'george', 'matthew', 'male', 'man'];

        const matchesHint = (voice, hints) => hints.some((h) => voice.name.toLowerCase().includes(h));

        const femaleVoices = pool.filter((v) => matchesHint(v, femaleHints));
        const maleVoices = pool.filter((v) => matchesHint(v, maleHints));

        if (role === 'fox') {
          return femaleVoices[0] || pool[0];
        }
        if (role === 'bat') {
          return femaleVoices[1] || femaleVoices[0] || pool[0];
        }
        if (role === 'skunk') {
          return maleVoices[0] || pool.find((v) => !matchesHint(v, femaleHints)) || pool[0];
        }
        return pool[0];
      }

      function stop() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        Object.values(chars).forEach((el) => el.classList.remove('is-talking'));
      }

      function speak(speaker, text, onDone) {
        stop();
        const charEl = chars[speaker];
        if (!voicesEnabled || !audioUnlocked || !('speechSynthesis' in window)) {
          if (charEl) charEl.classList.add('is-talking');
          setTimeout(() => {
            if (charEl) charEl.classList.remove('is-talking');
          }, 1600);
          onDone(false);
          return;
        }

        refreshVoices();
        const utterance = new SpeechSynthesisUtterance(text);
        const selectedVoice = pickVoice(speaker);
        if (selectedVoice) utterance.voice = selectedVoice;

        if (speaker === 'fox') {
          // Woman: warm, poised, confident
          utterance.pitch = 1.06;
          utterance.rate = 0.96;
        } else if (speaker === 'bat') {
          // Girl: bright, youthful, bubbly
          utterance.pitch = 1.54;
          utterance.rate = 1.14;
        } else if (speaker === 'skunk') {
          // Man: deeper, animated comedic delivery
          utterance.pitch = 0.84;
          utterance.rate = 1.0;
        }

        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          if (charEl) charEl.classList.remove('is-talking');
          onDone(true);
        };

        utterance.onstart = () => {
          if (charEl) charEl.classList.add('is-talking');
        };
        utterance.onend = finish;
        utterance.onerror = finish;

        try {
          window.speechSynthesis.speak(utterance);
        } catch (err) {
          finish();
        }
      }

      return { speak, stop };
    })();

    // ==================== SCENE CHOREOGRAPHY ====================
    function triggerSpillBurst() {
      spillFx.classList.remove('active');
      void spillFx.offsetWidth;
      spillFx.classList.add('active');
      playPopcornSpillSfx();
    }

    function applyCharacterPoses(entry) {
      chars.fox.classList.remove('state-peek', 'state-wave');
      chars.bat.classList.remove('state-chase', 'state-flip', 'state-perch');
      chars.skunk.classList.remove('state-wobble', 'state-fall', 'state-recover');

      if (entry.foxState) chars.fox.classList.add(entry.foxState);
      if (entry.batState) {
        void chars.bat.offsetWidth;
        chars.bat.classList.add(entry.batState);
        if (entry.batState === 'state-flip') playBatFlutterSfx();
      }
      if (entry.skunkState) chars.skunk.classList.add(entry.skunkState);

      if (entry.skunkState === 'state-fall' || entry.skunkState === 'state-recover') {
        bubbles.skunk.classList.add('low-pose');
      } else {
        bubbles.skunk.classList.remove('low-pose');
      }

      if (entry.triggerSpill) {
        triggerSpillBurst();
      } else if (entry.skunkState !== 'state-fall' && entry.skunkState !== 'state-recover') {
        spillFx.classList.remove('active');
      }
    }

    function renderLine(index) {
      clearTimeout(timerId);
      currentIndex = (index + DIALOGUE.length) % DIALOGUE.length;
      const entry = DIALOGUE[currentIndex];

      applyCharacterPoses(entry);

      Object.entries(bubbles).forEach(([key, el]) => {
        if (key === entry.speaker) {
          el.innerHTML = `<span class="speaker-tag speaker-${key}">${entry.name}</span>${entry.text}`;
          el.classList.add('visible');
        } else {
          el.classList.remove('visible');
        }
      });

      lineCounter.textContent = `Line ${currentIndex + 1} of ${DIALOGUE.length}`;
      playbackStatus.textContent = isPlaying
        ? (voicesEnabled && audioUnlocked ? 'Speaking' : 'Auto-playing')
        : 'Paused';

      VoiceManager.speak(entry.speaker, entry.text, (spokeAudio) => {
        if (!isPlaying) return;
        const delayMs = spokeAudio ? 950 : 4200;
        clearTimeout(timerId);
        timerId = setTimeout(() => {
          renderLine(currentIndex + 1);
        }, delayMs);
      });
    }

    function unlockAudio() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        ensureAudioCtx();
        startOverlay.classList.add('hidden');
      }
    }

    function stepTo(index) {
      unlockAudio();
      renderLine(index);
    }

    function togglePlayback() {
      unlockAudio();
      isPlaying = !isPlaying;
      btnToggle.textContent = isPlaying ? 'Pause' : 'Play';
      if (isPlaying) {
        renderLine(currentIndex);
      } else {
        clearTimeout(timerId);
        VoiceManager.stop();
        playbackStatus.textContent = 'Paused';
      }
    }

    function toggleVoices() {
      unlockAudio();
      voicesEnabled = !voicesEnabled;
      btnVoice.textContent = voicesEnabled ? 'Voices: On' : 'Voices: Muted';
      btnVoice.classList.toggle('muted', !voicesEnabled);
      if (!voicesEnabled) {
        VoiceManager.stop();
      } else if (isPlaying) {
        renderLine(currentIndex);
      }
    }

    function triggerCharacterReaction(charKey) {
      unlockAudio();
      const group = chars[charKey];
      if (group) {
        group.classList.remove('react');
        void group.offsetWidth;
        group.classList.add('react');
      }
      if (charKey === 'skunk') {
        // Clicking PoppyDash jumps directly to his popcorn-spill tumble!
        stepTo(3);
        return;
      }
      const nextForSpeaker = DIALOGUE.findIndex((item, idx) => idx > currentIndex && item.speaker === charKey);
      const fallbackForSpeaker = DIALOGUE.findIndex((item) => item.speaker === charKey);
      stepTo(nextForSpeaker !== -1 ? nextForSpeaker : fallbackForSpeaker);
    }

    btnStartSound.addEventListener('click', () => {
      unlockAudio();
      isPlaying = true;
      btnToggle.textContent = 'Pause';
      renderLine(0);
    });

    btnPrev.addEventListener('click', () => stepTo(currentIndex - 1));
    btnNext.addEventListener('click', () => stepTo(currentIndex + 1));
    btnSpill.addEventListener('click', () => stepTo(3));
    btnVoice.addEventListener('click', toggleVoices);
    btnToggle.addEventListener('click', togglePlayback);
    btnReplay.addEventListener('click', () => {
      unlockAudio();
      isPlaying = true;
      btnToggle.textContent = 'Pause';
      renderLine(0);
    });

    Object.values(bubbles).forEach((el) => {
      el.addEventListener('click', () => stepTo(currentIndex + 1));
    });

    chars.fox.addEventListener('click', () => triggerCharacterReaction('fox'));
    chars.bat.addEventListener('click', () => triggerCharacterReaction('bat'));
    chars.skunk.addEventListener('click', () => triggerCharacterReaction('skunk'));

    // Start visual animation cleanly (voices begin on first click via browser policy)
    renderLine(0);
  </script>
</body>
</html>
